[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "enthus"
version = "0.0.1"
description = "An experimental proactive conversation runtime"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
live = ["aiohttp>=3.12,<4"]

[project.scripts]
enthus = "enthus.cli:main"
enthus-live = "enthus.live:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
enthus = ["py.typed", "web/*"]
